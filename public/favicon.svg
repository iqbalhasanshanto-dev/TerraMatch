<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ==================================================================== -->
  <!-- TerraMatch Standalone Planetary Emblem Favicon (64x64 Transparent)    -->
  <!-- ==================================================================== -->
  <defs>
    <!-- Clips Earth interior wireframe lines to the globe circumference -->
    <clipPath id="favicon-globe-clip">
      <circle cx="28" cy="32" r="19.5" />
    </clipPath>

    <!-- Punches transparent separation behind front orbit, pin & Mars on globe -->
    <mask id="favicon-globe-mask">
      <rect width="64" height="64" fill="white" />
      <path
        d="M 57 32 A 29 9 0 0 1 -1 32"
        transform="rotate(-22 28 32)"
        stroke="black"
        stroke-width="4.8"
        stroke-linecap="butt"
      />
      <path
        d="M 42 7 C 38.4 7 35.5 9.9 35.5 13.5 C 35.5 17.8 42 23.5 42 23.5 C 42 23.5 48.5 17.8 48.5 13.5 C 48.5 9.9 45.6 7 42 7 Z"
        fill="black"
        stroke="black"
        stroke-width="2.4"
        stroke-linejoin="round"
      />
      <circle cx="44" cy="44" r="12.6" fill="black" />
    </mask>

    <!-- Punches clean Earth & Pin cutouts out of the back orbital arc -->
    <mask id="favicon-back-orbit-mask">
      <rect width="64" height="64" fill="white" />
      <circle cx="28" cy="32" r="21" fill="black" />
      <path
        d="M 42 7 C 38.4 7 35.5 9.9 35.5 13.5 C 35.5 17.8 42 23.5 42 23.5 C 42 23.5 48.5 17.8 48.5 13.5 C 48.5 9.9 45.6 7 42 7 Z"
        fill="black"
        stroke="black"
        stroke-width="2"
        stroke-linejoin="round"
      />
    </mask>

    <!-- Punches transparent clearance around Mars on the front orbital ring -->
    <mask id="favicon-front-orbit-mask">
      <rect width="64" height="64" fill="white" />
      <circle cx="44" cy="44" r="12.6" fill="black" />
    </mask>

    <!-- Punches a genuinely transparent circular center inside the pin -->
    <mask id="favicon-pin-mask">
      <rect width="64" height="64" fill="white" />
      <circle cx="42" cy="13.5" r="2.3" fill="black" />
    </mask>

    <!-- Clips Mars terminator shadow & craters cleanly to the Mars sphere -->
    <clipPath id="favicon-mars-clip">
      <circle cx="44" cy="44" r="11" />
    </clipPath>
  </defs>

  <!-- Layer 1: Back Half of Tilted Orbital Ring (#2A6F85) -->
  <path
    d="M -1 32 A 29 9 0 0 1 57 32"
    transform="rotate(-22 28 32)"
    stroke="#2A6F85"
    stroke-width="2.5"
    stroke-linecap="round"
    mask="url(#favicon-back-orbit-mask)"
  />

  <!-- Layer 2: Cyan Wireframe Globe (#00D8F6) -->
  <g mask="url(#favicon-globe-mask)">
    <g clip-path="url(#favicon-globe-clip)">
      <line x1="28" y1="12" x2="28" y2="52" stroke="#00D8F6" stroke-width="2.5" />
      <path
        d="M 28 12 C 17 17, 17 47, 28 52"
        stroke="#00D8F6"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M 28 12 C 39 17, 39 47, 28 52"
        stroke="#00D8F6"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M 8 32 Q 28 28 48 32"
        stroke="#00D8F6"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M 11 23 C 16 25, 19 31, 13 38 C 11 40, 14 45, 20 47"
        stroke="#00D8F6"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M 18 18 C 14 26, 23 35, 21 48"
        stroke="#00D8F6"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <line x1="13" y1="39" x2="21" y2="37" stroke="#00D8F6" stroke-width="2.2" stroke-linecap="round" />
      <line x1="14" y1="44" x2="21" y2="42" stroke="#00D8F6" stroke-width="2.2" stroke-linecap="round" />
      <line x1="28" y1="21" x2="37" y2="16" stroke="#00D8F6" stroke-width="2.3" stroke-linecap="round" />
      <line x1="28" y1="27" x2="43" y2="19" stroke="#00D8F6" stroke-width="2.3" stroke-linecap="round" />
      <line x1="28" y1="35" x2="47" y2="25" stroke="#00D8F6" stroke-width="2.3" stroke-linecap="round" />
    </g>
    <circle cx="28" cy="32" r="20" stroke="#00D8F6" stroke-width="2.5" />
  </g>

  <!-- Layer 3: Front Half of Tilted Orbital Ring (#2A6F85) -->
  <path
    d="M 57 32 A 29 9 0 0 1 -1 32"
    transform="rotate(-22 28 32)"
    stroke="#2A6F85"
    stroke-width="2.5"
    stroke-linecap="round"
    mask="url(#favicon-front-orbit-mask)"
  />

  <!-- Layer 4: Top-Right Location Pin Badge (#00D8F6) -->
  <path
    d="M 42 7 C 38.4 7 35.5 9.9 35.5 13.5 C 35.5 17.8 42 23.5 42 23.5 C 42 23.5 48.5 17.8 48.5 13.5 C 48.5 9.9 45.6 7 42 7 Z"
    fill="#00D8F6"
    mask="url(#favicon-pin-mask)"
  />

  <!-- Layer 5: Foreground Mars Sphere (#E87D3E & #C25922) -->
  <g clip-path="url(#favicon-mars-clip)">
    <circle cx="44" cy="44" r="11" fill="#C25922" />
    <circle cx="41.4" cy="41.4" r="10.4" fill="#E87D3E" />
    <circle cx="40.2" cy="40.8" r="2.1" fill="#B8521E" />
    <circle cx="47.2" cy="39.2" r="1.2" fill="#B8521E" />
  </g>
</svg>
