# ==============================================================================
# Build Configuration
# ==============================================================================
# Compiles the Vite React application into the `dist` directory for Netlify.
[build]
  command = "npm run build"
  publish = "dist"

# ==============================================================================
# Global HTTP Response Headers
# ==============================================================================
# Applied to every route (`/*`) served by Netlify.
# Note: Do NOT add a restrictive `Content-Security-Policy = "script-src 'self'"`
# header here, as Firebase Authentication requires external scripts and endpoints
# (`https://apis.google.com`, `https://*.firebaseapp.com`,
# `https://securetoken.googleapis.com`, `https://identitytoolkit.googleapis.com`).
[[headers]]
  for = "/*"
  [headers.values]
    # Allow Firebase Google OAuth popups to communicate back to the opener tab
    # cleanly instead of failing with `auth/internal-error`.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# ==============================================================================
# Firebase Auth Same-Origin Reverse Proxy
# ==============================================================================
# Proxies Firebase Authentication handler routes (`/__/auth/*`) through Netlify
# so OAuth redirect flows stay same-origin and avoid third-party storage blocks.
[[redirects]]
  from = "/__/auth/*"
  to = "https://terramatch-890dd.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# ==============================================================================
# Single-Page Application (SPA) Routing Fallback
# ==============================================================================
# Rewrites all routes to `/index.html` with HTTP 200 so React Router handles
# client-side navigation and Firebase OAuth redirect callbacks cleanly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200