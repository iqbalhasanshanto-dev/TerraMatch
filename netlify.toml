# ==============================================================================
# Build Configuration
# ==============================================================================
# Compiles the Vite React application into the `dist` directory for Netlify.
[build]
  command = "npm run build"
  publish = "dist"

# ==============================================================================
# Build Environment & Secrets Scanner Configuration
# ==============================================================================
# Exempts public Vite client-side environment variables (`VITE_*`) from
# Netlify's secret scanner, since Firebase web config and public API base URL
# are intentionally bundled into `dist/` for browser execution.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_apiKey,VITE_authDomain,VITE_projectId,VITE_storageBucket,VITE_messagingSenderId,VITE_appId,VITE_API_URL"

# ==============================================================================
# Global HTTP Response Headers
# ==============================================================================
# Applied to every route (`/*`) served by Netlify.
# Note: Do NOT add a restrictive `Content-Security-Policy = "script-src 'self'"`
# header here, as Firebase Authentication requires external scripts and endpoints
# (`https://apis.google.com`, `https://*.firebaseapp.com`,
# `https://securetoken.googleapis.com`, `https://identitytoolkit.googleapis.com`).
[[headers]]
  for = "/*"
  [headers.values]
    # Use `unsafe-none` so cross-origin Google OAuth popups can communicate via
    # `window.opener`, post credentials back to the app, and call `window.close()`
    # cleanly without hanging or triggering `auth/internal-error`.
    Cross-Origin-Opener-Policy = "unsafe-none"

# ==============================================================================
# Single-Page Application (SPA) Routing Fallback
# ==============================================================================
# Rewrites all routes to `/index.html` with HTTP 200 so React Router handles
# client-side navigation cleanly.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200